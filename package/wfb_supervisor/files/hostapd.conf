# AP interface
interface=wlan0
driver=nl80211

# SSID + band/channel
ssid=waybeam-01
hw_mode=a
channel=161

# Regulatory / beacons
ieee80211d=1
country_code=BO
wmm_enabled=1

# 11n/11ac (safe defaults)
ieee80211n=1
ieee80211ac=1

# Uncomment if you want HT40 / VHT80 (depends on driver capabilities)
ht_capab=[HT40+]
#vht_oper_chwidth=1
# For channel 161 as primary, VHT80 center is usually 155 (block 149-161)
#vht_oper_centr_freq_seg0_idx=155

# Security: WPA2-PSK CCMP
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=waybeam-01

# Optional: control socket (nice for hostapd_cli)
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
