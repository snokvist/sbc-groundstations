interface=waybeam0
driver=nl80211
ssid=waybeam-01

hw_mode=a
channel=161
country_code=BO
ieee80211d=1
wmm_enabled=1

ieee80211n=1
# Use HT20 or HT40- at channel 161 (HT40+ is not valid here)
ht_capab=[HT40-][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC1][LDPC]

ieee80211ac=0
# If your hardware supports VHT80 on this channel block:
vht_oper_chwidth=1
# For primary 161, the usual 80 MHz center is 155 (covers 149/153/157/161)
#vht_oper_centr_freq_seg0_idx=155
# Optional (only if supported by your AP radio/driver):
#vht_capab=[RXLDPC][SHORT-GI-80][TX-STBC-2BY1][RX-STBC-1]

# WPA2-PSK CCMP only (good for HT/VHT)
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=waybeam-01

# Optional: control socket (nice for hostapd_cli)
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ap_max_inactivity=600
skip_inactivity_poll=1
disassoc_low_ack=0
