      },
      {
        "name": "RECORDING",
        "items": [
          {
            "label": "record",
            "state": "@video_recording",
            "state_on": "REC",
            "http": {
              "path": "/pixelpilot/record",
              "port": 8060
            }
          },
          {
            "label": "size",
            "info": true,
            "state": "@rec_mib"
          },
          {
            "label": "time",
            "info": true,
            "state": "@rec_hms"
          },
          {
            "label": "rec osd show",
            "http": {
              "path": "/osd/asset",
              "port": 8060,
              "body": "{\"id\":\"recording\",\"visible\":true}"
            }
          },
          {
            "label": "rec osd hide",
            "http": {
              "path": "/osd/asset",
              "port": 8060,
              "body": "{\"id\":\"recording\",\"visible\":false}"
            }
          }
        ]
      },
      {
        "name": "DISPLAY",
        "items": [
          {
            "label": "gamma on",
            "http": {
              "path": "/pixelpilot/gamma",
              "port": 8060,
              "body": "{\"enabled\":true}"
            }
          },
          {
            "label": "gamma off",
            "http": {
              "path": "/pixelpilot/gamma",
              "port": 8060,
              "body": "{\"enabled\":false}"
            }
          },
          {
            "label": "osd on",
            "http": {
              "path": "/pixelpilot/osd",
              "port": 8060,
              "body": "{\"enabled\":true}"
            }
          },
          {
            "label": "osd off",
            "http": {
              "path": "/pixelpilot/osd",
              "port": 8060,
              "body": "{\"enabled\":false}"
            }
          }
        ]
      },
      {
        "name": "SYSTEM",
        "items": [
          {
            "label": "uptime",
            "command": "awk '{d=int($1/86400);h=int($1%86400/3600);m=int($1%3600/60);printf \"up %dd %dh %dm\\n\",d,h,m}' /proc/uptime"
          },
          {
            "label": "ip addr",
            "command": "ip -4 -o addr show scope global 2>/dev/null | grep -v ' docker\\| br-\\| veth' | awk '{printf \"%s %s \",$2,$4} END{print \"\"}' | grep . || hostname -I"
          },
          {
            "label": "mem",
            "command": "free -m | awk '/^Mem/{printf \"mem %s/%s MiB\\n\",$3,$2}'"
          },
          {
            "label": "disk",
            "command": "df -h / | awk 'NR==2{printf \"root %s/%s %s\\n\",$3,$2,$5}'"
          },
