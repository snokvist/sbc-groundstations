                  "body": "{\"cmd\":\"mode\",\"arg\":1}"
                },
                "needs": "@wblink_claimed",
                "needs_value": "yes",
                "confirm": true
              }
            ]
          },
          {
            "label": "60 fps",
            "items": [
              {
                "label": "highrange 1280x720",
                "http": {
                  "path": "/api/v1/vehicle/command",
                  "body": "{\"cmd\":\"mode\",\"arg\":6}"
                },
                "needs": "@wblink_claimed",
                "needs_value": "yes",
                "confirm": true
              },
              {
                "label": "medrange 1920x1080",
                "http": {
                  "path": "/api/v1/vehicle/command",
                  "body": "{\"cmd\":\"mode\",\"arg\":8}"
                },
                "needs": "@wblink_claimed",
                "needs_value": "yes",
                "confirm": true
              },
              {
                "label": "lowrange 1080p",
                "http": {
                  "path": "/api/v1/vehicle/command",
                  "body": "{\"cmd\":\"mode\",\"arg\":7}"
                },
                "needs": "@wblink_claimed",
                "needs_value": "yes",
                "confirm": true
              }
            ]
          },
          {
            "label": "30 fps",
            "items": [
              {
                "label": "highrange 1080p",
                "http": {
                  "path": "/api/v1/vehicle/command",
                  "body": "{\"cmd\":\"mode\",\"arg\":3}"
                },
                "needs": "@wblink_claimed",
                "needs_value": "yes",
                "confirm": true
              },
              {
                "label": "medrange 1080p",
                "http": {
                  "path": "/api/v1/vehicle/command",
                  "body": "{\"cmd\":\"mode\",\"arg\":5}"
                },
                "needs": "@wblink_claimed",
                "needs_value": "yes",
                "confirm": true
              },
              {
                "label": "lowrange 1080p",
                "http": {
                  "path": "/api/v1/vehicle/command",
                  "body": "{\"cmd\":\"mode\",\"arg\":4}"
                },
                "needs": "@wblink_claimed",
                "needs_value": "yes",
                "confirm": true
              }
            ]
          },
          {
            "label": "variable 1280x720",
            "http": {
              "path": "/api/v1/vehicle/command",
              "body": "{\"cmd\":\"mode\",\"arg\":9}"
            },
            "needs": "@wblink_claimed",
            "needs_value": "yes",
            "confirm": true
          }
        ]
