      {
        "name": "ADAPTIVE",
        "items": [
          {
            "label": "claim",
            "info": true,
            "state": "@wblink_claimed"
          },
          {
            "label": "arq on",
            "http": {
              "path": "/api/v1/vehicle/command",
              "body": "{\"cmd\":\"arq\",\"arg\":1}"
            },
            "needs": "@wblink_claimed",
            "needs_value": "yes"
          },
          {
            "label": "arq off",
            "http": {
              "path": "/api/v1/vehicle/command",
              "body": "{\"cmd\":\"arq\",\"arg\":0}"
            },
            "needs": "@wblink_claimed",
            "needs_value": "yes"
          },
          {
            "label": "mcs adapt",
            "http": {
              "path": "/api/v1/vehicle/command",
              "body": "{\"cmd\":\"selector\",\"arg\":0}"
            },
            "needs": "@wblink_claimed",
            "needs_value": "yes"
          },
          {
            "label": "mcs freeze",
            "http": {
              "path": "/api/v1/vehicle/command",
              "body": "{\"cmd\":\"selector\",\"arg\":1}"
            },
            "needs": "@wblink_claimed",
            "needs_value": "yes"
          },
          {
            "label": "fps ladder on",
            "http": {
              "path": "/api/v1/vehicle/command",
              "body": "{\"cmd\":\"fps_ladder\",\"arg\":1}"
            },
            "needs": "@wblink_claimed",
            "needs_value": "yes"
          },
          {
            "label": "fps ladder off",
            "http": {
              "path": "/api/v1/vehicle/command",
              "body": "{\"cmd\":\"fps_ladder\",\"arg\":0}"
            },
            "needs": "@wblink_claimed",
            "needs_value": "yes"
          },
          {
            "label": "gnd nack on",
            "http": {
              "path": "/api/v1/arq",
              "body": "{\"enabled\":true}"
            }
          },
          {
            "label": "gnd nack off",
            "http": {
              "path": "/api/v1/arq",
              "body": "{\"enabled\":false}"
            }
          }
