gsmenu:
  enabled: true
  gpio:
    # Eachine VRX button map — OpenIPC "Ruby" GPIO layout.
    # Verified on the factory unit at 192.168.2.170 (see ../../HARDWARE.md).
    # Values are 40-pin header PIN numbers; pixelpilot resolves each via
    # gpiofind "PIN_<n>" (gpiochip3). No kernel gpio-keys node.
    left: 13
    right: 11
    up: 16
    down: 18
    center: 38
    rec: 32

  actions:
    ground:
      - label: Toggle gadget mode
        action: /usr/sbin/gadget
      - label: Generate support package
        action: /usr/bin/collect_support_data.sh
