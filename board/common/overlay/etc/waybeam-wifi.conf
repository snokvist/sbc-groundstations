# /etc/waybeam-wifi.conf — Waybeam WiFi configuration
# Sourced by /usr/bin/waybeam-wifi.sh

# Mode: "sta" (station/client, default) or "ap" (access point)
WIFI_MODE="sta"

# STA mode: ordered SSID:PSK list (top = highest priority)
# wpa_supplicant will prefer higher-priority networks when multiple are visible
WIFI_NETWORKS="
waybeam-01:waybeam-01
waybeam-02:waybeam-02
waybeam-03:waybeam-03
waybeam-04:waybeam-04
waybeam-05:waybeam-05
waybeam-06:waybeam-06
waybeam-07:waybeam-07
waybeam-08:waybeam-08
OpenIPC:12345678
"

# Interface selection: "auto" = first available WiFi interface
# Set to a specific name (e.g. "wlx40a5ef2f2308") to pin
WIFI_PRIMARY_IFACE="auto"

# DHCP client script — apfpv version does NOT add default routes,
# preserving SSH access over eth0
WIFI_UDHCPC_SCRIPT="/etc/udhcpc/udhcpc.apfpv.script"

# Cooperative RX diversity: "auto" (detect capability), "yes", "no"
COOP_RX_ENABLED="auto"

# Seconds between helper health checks (background monitor loop)
COOP_RX_MONITOR_INTERVAL=5

# Boot-time wait for WiFi interfaces to appear (USB enumeration delay)
WIFI_IFACE_WAIT=15

# Seconds to wait for wpa_supplicant association
WIFI_ASSOC_TIMEOUT=15

# Number of scan/connect retries before giving up
WIFI_SCAN_RETRIES=3

# AP mode settings
AP_SSID="WaybeamGS"
AP_PSK="waybeamgs"
AP_CHANNEL=149
AP_COUNTRY="SE"
AP_IP="192.168.4.1"
AP_NETMASK="255.255.255.0"
AP_DHCP_START="192.168.4.10"
AP_DHCP_END="192.168.4.20"
