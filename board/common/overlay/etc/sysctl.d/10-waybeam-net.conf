# Waybeam network buffer tuning
#
# Default rmem_max/wmem_max is 212KB — too small for RTP video bursts.
# At 15 Mbps, a single GOP can produce 100KB+ frames. With jitter and
# scheduling delays, the kernel can queue multiple frames before userspace
# reads them. 2.5MB gives ~1.3s of buffering headroom at 15 Mbps.

# Socket receive buffer max (for RTP video ingest on ground station)
net.core.rmem_max = 2621440

# Socket send buffer max (for CRSF/telemetry UDP)
net.core.wmem_max = 2621440

# Raise defaults so applications get usable buffers without setsockopt
net.core.rmem_default = 524288
net.core.wmem_default = 524288

# Input queue length — prevent drops under burst from WiFi driver
net.core.netdev_max_backlog = 5000
